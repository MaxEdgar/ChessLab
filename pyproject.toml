[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chesslab"
version = "1.0.0"
description = "A local, Stockfish-powered chess analysis desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ChessLab contributors" }]
keywords = ["chess", "stockfish", "analysis", "pyside6", "uci"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "PySide6>=6.7,<7.0",
    "chess>=1.11,<2.0",
]

[project.scripts]
chesslab = "chesslab.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/chesslab"

[tool.setuptools.packages.find]
include = ["chesslab*"]
